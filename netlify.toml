[build]
  command = "npm run build"
  publish = "dist"

# Keep form POSTs on the static file so Netlify Forms can process them (not the SSR handler).
[[redirects]]
  from = "/forms.html"
  to = "/forms.html"
  status = 200
  force = true

# TikTok feed and video proxy. Forced so the site SSR catch-all does not swallow them.
[[redirects]]
  from = "/api/tiktok-videos"
  to = "/.netlify/functions/tiktok-videos"
  status = 200
  force = true

[[redirects]]
  from = "/api/tiktok-media"
  to = "/.netlify/functions/tiktok-media"
  status = 200
  force = true
